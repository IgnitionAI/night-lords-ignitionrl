<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Meute — prototype gris</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#hud{position:fixed;left:12px;top:10px;pointer-events:none;max-width:min(520px,94vw);padding:8px 11px 9px;background:rgba(6,8,14,.78);border:1px solid rgba(196,162,98,.4);color:#f3f0e8;font-size:14px;line-height:1.4;text-shadow:0 1px 2px #000,0 0 10px #000}
#hud .head{margin-bottom:2px}
#hud .obj{color:#f4e3b0;font-weight:650;margin:3px 0 5px}
#hud .clock{font-variant-numeric:tabular-nums;font-weight:700}
#hud .clock.warn{color:#ff8a6a}
#hud .score{white-space:nowrap}
#hud .bar{width:min(260px,100%);height:10px;background:#311;border:1px solid #c4a262;margin:3px 0}#hud .bar i{display:block;height:100%;background:linear-gradient(90deg,#d9b25a,#f3e3b0)}
#hud .bar.beacon{height:7px;background:#132;border-color:#4a8}#hud .bar.beacon i{background:linear-gradient(90deg,#2a8,#8fc)}
#hud .vitals{margin-top:4px}
#hud .roster{margin-top:4px}#hud .roster .up{color:#e8f0d8}#hud .roster .down{color:#c09090;text-decoration:line-through}
#hud .alarm{color:#ff6a3a}#hud .crit{color:#ff8a6a}#hud .stagger{color:#f88}#hud .demo{color:#ffb020}
#hud .meta,#hud .burn{margin-top:3px;font-size:12px;color:#c5ccd6}
#msg .how{margin:.6em 0;opacity:.9}
#dbg{position:fixed;right:8px;top:8px;background:rgba(5,8,16,.82);border:1px solid #345;padding:6px 8px;font:11px/1.3 ui-monospace,monospace;max-width:46vw}
#dbg table{border-collapse:collapse}#dbg td,#dbg th{padding:1px 5px;text-align:left}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);border:1px solid #a85;padding:16px 22px;max-width:80vw;text-align:center;display:none;font-size:15px}
#help{position:fixed;left:12px;bottom:8px;opacity:.65;font-size:11px}
.float{position:fixed;font-weight:700;pointer-events:none;transition:transform .7s,opacity .7s;text-shadow:0 1px 3px #000}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
@media (max-aspect-ratio:1/1){#dbg{left:8px;right:8px;top:auto;bottom:30px;max-width:none}}
</style></head><body>
<canvas id="c"></canvas><div id="flash"></div>
<div id="hud"></div><div id="dbg"></div><div id="msg"></div>
<div id="help">Victoire Terminator : balise 6 s, meute à terre, ou 2:00 tenues. Défaite : armure à 0.<br>ZQSD ou WASD bouger · ←/→ pivoter (lent) · Espace storm bolter · F ou Maj gantelet · V vue de contrôle · Entrée manche suivante · P pause</div>
<script type="module" src="/web/main.ts"></script></body></html>
