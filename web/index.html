<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Meute — prototype gris</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#hud{position:fixed;left:12px;top:10px;pointer-events:none;text-shadow:0 1px 2px #000}
#hud .bar{width:220px;height:12px;background:#311;border:1px solid #a85;margin:4px 0}#hud .bar i{display:block;height:100%;background:linear-gradient(90deg,#d9b25a,#f3e3b0)}
#dbg{position:fixed;right:8px;top:8px;background:rgba(5,8,16,.82);border:1px solid #345;padding:6px 8px;font:11px/1.3 ui-monospace,monospace;max-width:46vw}
#dbg table{border-collapse:collapse}#dbg td,#dbg th{padding:1px 5px;text-align:left}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);border:1px solid #a85;padding:16px 22px;max-width:80vw;text-align:center;display:none;font-size:15px}
#help{position:fixed;left:12px;bottom:8px;opacity:.65;font-size:11px}
.float{position:fixed;font-weight:700;pointer-events:none;transition:transform .7s,opacity .7s;text-shadow:0 1px 3px #000}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
@media (max-aspect-ratio:1/1){#dbg{left:8px;right:8px;top:auto;bottom:30px;max-width:none}}
</style></head><body>
<canvas id="c"></canvas><div id="flash"></div>
<div id="hud"></div><div id="dbg"></div><div id="msg"></div>
<div id="help">ZQSD/WASD bouger · ←/→ pivoter (lent) · Espace storm bolter · F gantelet · V vue de contrôle · Entrée manche suivante · P pause</div>
